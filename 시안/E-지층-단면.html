<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배선도 시안 E</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --orange: #FF5000;
    --orange-text: #D04000;
    --black: #000000;
    --ink: #222222;
    --ink-2: #4A4A4A;
    --ink-3: #767676;
    --ink-4: #A3A3A3;
    --line-2: #D9D9D9;
    --fill-1: #EDEDED;
    --paper: #F7F7F5;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--white); color: var(--ink); }
  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 32px; }
  .tag { font-size: 12px; color: var(--ink-3); letter-spacing: 0.02em; margin: 0 0 20px; }
  h1 { word-break: keep-all; text-wrap: balance; font-size: clamp(22px, 2.6vw, 32px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; margin: 0 0 8px; }
  .sub { font-size: clamp(14px, 1.3vw, 16px); color: var(--ink-2); margin: 0 0 24px; }
  svg { display: block; width: 100%; height: auto; }

  svg text { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-variant-numeric: tabular-nums; }
  .node { fill: var(--white); stroke: var(--ink); stroke-width: 1; }
  .node-hl { fill: var(--white); stroke: var(--orange); stroke-width: 2; }
  .num { font-size: 14px; font-weight: 700; fill: var(--ink-3); }
  .num-hl { font-size: 14px; font-weight: 700; fill: var(--orange-text); }
  .name { font-size: 17px; font-weight: 700; fill: var(--ink); letter-spacing: -0.01em; }
  .name-hl { font-size: 17px; font-weight: 700; fill: var(--orange-text); letter-spacing: -0.01em; }
  .desc { font-size: 13px; fill: var(--ink-2); }
  .loop-label { font-size: 14px; font-weight: 700; fill: var(--ink); }
  .small-tag { font-size: 13px; fill: var(--ink-3); }

  .wire { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  .wire-hl { fill: none; stroke: var(--orange); stroke-width: 2; }
  .arrow-ink { fill: var(--ink); }
  .arrow-hl { fill: var(--orange); }
  .edge-label { font-size: 15px; font-weight: 700; fill: var(--orange-text); }

  .layer { stroke: var(--ink); stroke-width: 1; }
  .l1 { fill: var(--fill-1); }
  .l2 { fill: var(--line-2); }
  .l3 { fill: var(--orange); stroke: var(--orange); }
  .slot { fill: none; stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 5 4; }
  .ver { font-size: 18px; font-weight: 700; fill: var(--ink-2); }
  .ver-hl { font-size: 24px; font-weight: 700; fill: var(--white); }
  .sb-name { font-size: 22px; font-weight: 700; fill: var(--ink); letter-spacing: -0.01em; }
  .sb-desc { font-size: 14px; fill: var(--ink-2); }

  .bedrock { fill: var(--ink); }
  .bed-tag { font-size: 13px; fill: var(--ink-4); }
  .bed-name { font-size: 18px; font-weight: 700; fill: var(--white); }
  .bed-desc { font-size: 13px; fill: var(--line-2); }
  .bed-all { font-size: 13px; font-weight: 700; fill: var(--white); letter-spacing: 0.04em; }

  .rule { stroke: var(--line-2); stroke-width: 1; }
  .metric-head { font-size: 14px; font-weight: 700; fill: var(--ink); }
  .metric { font-size: 14px; fill: var(--ink-2); }
  .metric-sep { font-size: 14px; fill: var(--ink-4); }

  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .wrap { padding: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="tag">시안 E · 지층 단면</p>
  <h1>기준을 주면, 보고가 돌 때마다 시스템이 스스로 정교해진다</h1>
  <p class="sub">세컨드브레인 자가피드백 시스템 · 에이전트 배선도</p>

  <svg viewBox="0 0 1200 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="에이전트 배선도">
    <defs>
      <marker id="ah-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" class="arrow-ink"/>
      </marker>
      <marker id="ah-hl" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" class="arrow-hl"/>
      </marker>
    </defs>

    <!-- ===== 실행 루프 (y 64–168) ===== -->
    <text class="loop-label" x="32" y="50">실행 루프 · 보고서 한 건을 고친다</text>

    <g>
      <rect class="node" x="32" y="64" width="150" height="104"/>
      <text class="num" x="46" y="94">1</text>
      <text class="name" x="64" y="94">초안 입력</text>
      <text class="desc" x="46" y="122">직원이 보고서</text>
      <text class="desc" x="46" y="142">초안을 넣는다</text>
    </g>
    <g>
      <rect class="node" x="204" y="64" width="150" height="104"/>
      <text class="num" x="218" y="94">2</text>
      <text class="name" x="236" y="94">자가 평가</text>
      <text class="desc" x="218" y="122">기준에 비춰</text>
      <text class="desc" x="218" y="142">점검한다</text>
    </g>
    <g>
      <rect class="node" x="376" y="64" width="150" height="104"/>
      <text class="num" x="390" y="94">3</text>
      <text class="name" x="408" y="94">1장 리포트</text>
      <text class="desc" x="390" y="122">판정과</text>
      <text class="desc" x="390" y="142">수정할 것 3건</text>
    </g>
    <g>
      <rect class="node" x="548" y="64" width="150" height="104"/>
      <text class="num" x="562" y="94">4</text>
      <text class="name" x="580" y="94">1차 보고</text>
      <text class="desc" x="562" y="122">고친 뒤</text>
      <text class="desc" x="562" y="142">보고한다</text>
    </g>

    <!-- 실행 연결 1→2→3→4 -->
    <path class="wire" d="M182,116 H204" marker-end="url(#ah-ink)"/>
    <path class="wire" d="M354,116 H376" marker-end="url(#ah-ink)"/>
    <path class="wire" d="M526,116 H548" marker-end="url(#ah-ink)"/>

    <!-- ===== 학습 루프 (y 240–344) ===== -->
    <g>
      <rect class="node" x="32" y="240" width="150" height="104"/>
      <text class="num" x="46" y="270">5</text>
      <text class="name" x="64" y="270">실측 기록</text>
      <text class="desc" x="46" y="298">실제 피드백과</text>
      <text class="desc" x="46" y="318">사전 평가를 대조한다</text>
    </g>
    <g>
      <rect class="node" x="204" y="240" width="150" height="104"/>
      <text class="num" x="218" y="270">6</text>
      <text class="name" x="236" y="270">패턴 축적</text>
      <text class="desc" x="218" y="298">반복되는 차이를</text>
      <text class="desc" x="218" y="318">모은다</text>
    </g>
    <g>
      <rect class="node" x="376" y="240" width="150" height="104"/>
      <text class="num" x="390" y="270">7</text>
      <text class="name" x="408" y="270">기준 제안</text>
      <text class="desc" x="390" y="298">근거를 붙여</text>
      <text class="desc" x="390" y="318">변경안을 올린다</text>
    </g>
    <g>
      <rect class="node-hl" x="548" y="240" width="150" height="104"/>
      <text class="num-hl" x="562" y="270">8</text>
      <text class="name-hl" x="580" y="270">최종 승인</text>
      <text class="desc" x="562" y="298">주 1회, 승인한 것만</text>
      <text class="desc" x="562" y="318">기준이 된다</text>
    </g>

    <text class="loop-label" x="32" y="374">학습 루프 · 기준 자체를 고친다</text>

    <!-- 학습 연결: 4 → 5 (행 사이 통로) -->
    <path class="wire-hl" d="M623,168 V204 H107 V240" marker-end="url(#ah-hl)"/>
    <!-- 5 → 6 → 7 → 8 -->
    <path class="wire-hl" d="M182,292 H204" marker-end="url(#ah-hl)"/>
    <path class="wire-hl" d="M354,292 H376" marker-end="url(#ah-hl)"/>
    <path class="wire-hl" d="M526,292 H548" marker-end="url(#ah-hl)"/>

    <!-- 승격: 8 → 다음 층 (기준 v+1) -->
    <path class="wire-hl" d="M698,292 H744 V159 H800" marker-end="url(#ah-hl)"/>
    <text class="edge-label" x="734" y="210" text-anchor="end">기준 v+1</text>

    <!-- ===== 세컨드브레인 · 지층 단면 (x 800–1168) ===== -->
    <text class="small-tag" x="800" y="56">기준</text>
    <text class="sb-name" x="800" y="86">세컨드브레인</text>
    <text class="sb-desc" x="800" y="110">평가기준 · 내부기준</text>

    <!-- 다음 층 자리 (비어 있음) -->
    <rect class="slot" x="800.5" y="132.5" width="367" height="53"/>
    <!-- v3 최신 -->
    <rect class="layer l3" x="800" y="192" width="368" height="70"/>
    <text class="ver-hl" x="822" y="236">v3</text>
    <!-- v2 -->
    <rect class="layer l2" x="800.5" y="262.5" width="367" height="69"/>
    <text class="ver" x="822" y="304">v2</text>
    <!-- v1 (가장 오래된 층) -->
    <rect class="layer l1" x="800.5" y="331.5" width="367" height="70"/>
    <text class="ver" x="822" y="373">v1</text>

    <!-- 기준 제공: 최신 층(v3) → 2 자가 평가 (상단 통로) -->
    <path class="wire" d="M1168,227 H1184 V24 H279 V64" marker-end="url(#ah-ink)"/>

    <!-- ===== 기반암: 경량 온톨로지 (전 구간) ===== -->
    <rect class="bedrock" x="32" y="430" width="1136" height="64"/>
    <text class="bed-tag" x="52" y="467">전역규칙</text>
    <text class="bed-name" x="124" y="468">경량 온톨로지</text>
    <text class="bed-desc" x="256" y="467">용어 · 타입 · 표기를 하나로 (비즈니스 인텔리전스 × 브랜드 아이덴티티)</text>
    <text class="bed-all" x="1148" y="467" text-anchor="end">전 구간 적용</text>

    <!-- 구축: 온톨로지 → 세컨드브레인 바닥 -->
    <path class="wire" d="M984,430 V402" marker-end="url(#ah-ink)"/>

    <!-- 원천: 수집 → 온톨로지 -->
    <rect class="node" x="32" y="526" width="328" height="56"/>
    <text class="small-tag" x="52" y="559">원천</text>
    <text class="name" x="90" y="560">수집</text>
    <text class="desc" x="140" y="559">인터뷰 · 기존 문서 · 과거 피드백</text>
    <path class="wire" d="M110,526 V494" marker-end="url(#ah-ink)"/>

    <!-- ===== 하단 지표 ===== -->
    <line class="rule" x1="32" y1="614.5" x2="1168" y2="614.5"/>
    <text x="32" y="646">
      <tspan class="metric-head">돌릴수록 좋아지는지 보는 지표</tspan>
      <tspan class="metric" dx="24">판정 일치율</tspan>
      <tspan class="metric-sep" dx="10">·</tspan>
      <tspan class="metric" dx="10">사전 포착률</tspan>
      <tspan class="metric-sep" dx="10">·</tspan>
      <tspan class="metric" dx="10">1차 보고 통과율</tspan>
      <tspan class="metric-sep" dx="10">·</tspan>
      <tspan class="metric" dx="10">제안 채택률</tspan>
    </text>
  </svg>
</div>
</body>
</html>
