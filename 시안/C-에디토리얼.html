<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배선도 시안 C</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
  :root {
    --paper: #F7F7F5;
    --ink: #222222;
    --ink2: #4A4A4A;
    --g1: #767676;
    --g2: #A3A3A3;
    --g3: #D9D9D9;
    --band: #EDEDED;
    --orange: #FF5000;
    --orange-text: #D04000;
    --sans: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --serif: "Noto Serif KR", "Batang", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  .sheet { max-width: 1280px; margin: 0 auto; padding: 28px 48px 40px; }
  .stamp { font-size: 12px; letter-spacing: 0.04em; color: var(--g1); margin: 0 0 36px; }
  .masthead { border-top: 1px solid var(--ink); padding-top: 22px; display: grid; grid-template-columns: 1fr; gap: 14px; }
  h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(28px, 3.5vw, 46px); line-height: 1.32; letter-spacing: -0.02em; margin: 0; color: var(--ink); }
  .sub { font-size: 15px; color: var(--ink2); margin: 0; padding-bottom: 20px; border-bottom: 1px solid var(--ink2); }
  figure { margin: 8px 0 0; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .t13 { font-size: 13px; }
  .mid { fill: var(--ink2); }
  .tag { font-size: 13px; fill: var(--g1); letter-spacing: 0.06em; }
  .nm18 { font-size: 18px; font-weight: 700; fill: var(--ink); }
  .nm20 { font-size: 20px; font-weight: 700; fill: var(--ink); }
  .fn { font-size: 15px; font-weight: 700; fill: var(--ink); }
  .num { font-size: 13px; font-weight: 700; }
  .key { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .ver { font-size: 13px; font-weight: 600; }
  .vnew { fill: var(--orange-text); font-weight: 700; }
  .vplus { font-size: 13px; font-weight: 700; fill: var(--orange-text); }
  .node { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
  .pt { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
  .exec { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; }
  .learn { fill: none; stroke: var(--orange); stroke-width: 2; stroke-linecap: round; }
  .conn { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--ink2); stroke-width: 1; }
  .hair { stroke: var(--ink2); stroke-width: 1; }
  .metrics { border-top: 1px solid var(--ink); margin-top: 6px; padding-top: 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 0; font-size: 14px; }
  .metrics b { font-weight: 700; margin-right: 22px; }
  .metrics span { color: var(--ink2); }
  .metrics i { font-style: normal; color: var(--g2); margin: 0 14px; }
  @media (max-width: 640px) { .sheet { padding: 20px 16px 28px; } }
  @media print {
    html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: var(--paper); }
    .sheet { padding: 16px 24px; }
  }
</style>
</head>

</html>
