<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배선도 시안 D</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --orange: #FF5000;
    --orange-text: #D04000;
    --black: #000000;
    --ink: #222222;
    --ink-2: #4A4A4A;
    --gray: #767676;
    --gray-2: #A3A3A3;
    --line-1: #D9D9D9;
    --line-2: #EDEDED;
    --zone: #F7F7F5;
    --bg: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 28px 40px 40px; }
  .tag { font-size: 12px; letter-spacing: .06em; color: var(--gray); margin: 0 0 22px; }
  h1 { word-break: keep-all; text-wrap: balance; font-size: clamp(22px, 2.6vw, 30px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; color: var(--black); margin: 0; }
  .sub { font-size: 16px; color: var(--ink-2); margin: 8px 0 20px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-variant-numeric: tabular-nums; }
  .nm { font-size: 17px; font-weight: 700; fill: var(--ink); }
  .nm-o { font-size: 17px; font-weight: 700; fill: var(--orange-text); }
  .ds { font-size: 13px; font-weight: 400; fill: var(--gray); }
  .tg { font-size: 13px; font-weight: 600; fill: var(--gray); letter-spacing: .08em; }
  .lg { font-size: 14px; font-weight: 500; fill: var(--ink); }
  .lg b, .lg .b { font-weight: 700; }
  .zl { font-size: 13px; font-weight: 600; fill: var(--gray); letter-spacing: .08em; }
  .ft { font-size: 14px; font-weight: 700; fill: var(--ink); }
  .fm { font-size: 14px; font-weight: 400; fill: var(--ink-2); }
  .vx { font-size: 13px; font-weight: 600; fill: var(--gray-2); }
  .vx-o { font-size: 13px; font-weight: 700; fill: var(--orange-text); }
  .vp { font-size: 13px; font-weight: 700; fill: var(--orange-text); }
  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .wrap { padding: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="tag">시안 D · 노선도형</p>
  <h1>기준을 주면, 보고가 돌 때마다 시스템이 스스로 정교해진다</h1>
  <p class="sub">세컨드브레인 자가피드백 시스템 · 에이전트 배선도</p>

  <svg viewBox="0 0 1200 740" role="img" aria-label="에이전트 배선도 노선도">
    <defs>
      <marker id="a-ink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="2" refY="6" orient="auto">
        <path d="M0,0 L10,6 L0,12 z" fill="#222222"/>
      </marker>
      <marker id="a-org" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="2" refY="6" orient="auto">
        <path d="M0,0 L10,6 L0,12 z" fill="#FF5000"/>
      </marker>
      <marker id="a-gry" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="2" refY="6" orient="auto">
        <path d="M0,0 L10,6 L0,12 z" fill="#767676"/>
      </marker>
      <marker id="a-thin" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="0" refY="3.5" orient="auto">
        <path d="M0,0 L7,3.5 L0,7 z" fill="#222222"/>
      </marker>
    </defs>

    <!-- 요금 구역: 경량 온톨로지 전 구간 적용 -->
    <rect x="40" y="40" width="1120" height="640" fill="var(--zone)"/>
    <text class="zl" x="1136" y="662" text-anchor="end">전 구간 적용</text>

    <!-- 범례: 루프 이름 -->
    <line x1="64" y1="67" x2="92" y2="67" stroke="var(--ink)" stroke-width="6"/>
    <text class="lg" x="104" y="72"><tspan class="b" font-weight="700">실행 루프</tspan> · 보고서 한 건을 고친다</text>
    <line x1="64" y1="93" x2="92" y2="93" stroke="var(--orange)" stroke-width="6"/>
    <text class="lg" x="104" y="98"><tspan font-weight="700">학습 루프</tspan> · 기준 자체를 고친다</text>

    <!-- 구축 지선 (회색): 수집 → 경량 온톨로지 → 세컨드브레인 -->
    <path d="M121 630 H361" fill="none" stroke="var(--gray)" stroke-width="4" marker-end="url(#a-gry)"/>
    <path d="M380 619 V514" fill="none" stroke="var(--gray)" stroke-width="4" marker-end="url(#a-gry)"/>

    <!-- 기준 제공: 세컨드브레인 → 2 자가 평가 -->
    <path d="M380 474 V188" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#a-thin)"/>

    <!-- 실행선 (차콜): 1 → 2 → 3 → 4 -->
    <path d="M171 190 H361" fill="none" stroke="var(--ink)" stroke-width="6" marker-end="url(#a-ink)"/>
    <path d="M391 190 H581" fill="none" stroke="var(--ink)" stroke-width="6" marker-end="url(#a-ink)"/>
    <path d="M611 190 H816" fill="none" stroke="var(--ink)" stroke-width="6" marker-end="url(#a-ink)"/>

    <!-- 학습선 (오렌지): 4 → 5 → 6 → 7 → 8 → 세컨드브레인 -->
    <path d="M856 190 H1000 A40 40 0 0 1 1040 230 V321" fill="none" stroke="var(--orange)" stroke-width="6" marker-end="url(#a-org)"/>
    <path d="M1040 351 V450 A40 40 0 0 1 1000 490 H919" fill="none" stroke="var(--orange)" stroke-width="6" marker-end="url(#a-org)"/>
    <path d="M889 490 H739" fill="none" stroke="var(--orange)" stroke-width="6" marker-end="url(#a-org)"/>
    <path d="M709 490 H559" fill="none" stroke="var(--orange)" stroke-width="6" marker-end="url(#a-org)"/>
    <path d="M529 490 H404" fill="none" stroke="var(--orange)" stroke-width="6" marker-end="url(#a-org)"/>
    <text class="vp" x="466" y="476" text-anchor="middle">기준 v+1</text>

    <!-- 역: 실행선 -->
    <circle cx="160" cy="190" r="9" fill="#FFFFFF" stroke="var(--ink)" stroke-width="4"/>
    <circle cx="380" cy="190" r="9" fill="#FFFFFF" stroke="var(--ink)" stroke-width="4"/>
    <circle cx="600" cy="190" r="9" fill="#FFFFFF" stroke="var(--ink)" stroke-width="4"/>
    <!-- 환승역 4 -->
    <circle cx="840" cy="190" r="14" fill="#FFFFFF" stroke="var(--ink)" stroke-width="4"/>

    <!-- 역: 학습선 -->
    <circle cx="1040" cy="340" r="9" fill="#FFFFFF" stroke="var(--orange)" stroke-width="4"/>
    <circle cx="900" cy="490" r="9" fill="#FFFFFF" stroke="var(--orange)" stroke-width="4"/>
    <circle cx="720" cy="490" r="9" fill="#FFFFFF" stroke="var(--orange)" stroke-width="4"/>
    <circle cx="540" cy="490" r="9" fill="var(--orange)" stroke="var(--orange)" stroke-width="4"/>
    <!-- 환승역 세컨드브레인 -->
    <circle cx="380" cy="490" r="14" fill="#FFFFFF" stroke="var(--ink)" stroke-width="4"/>

    <!-- 역: 구축 지선 -->
    <circle cx="110" cy="630" r="9" fill="#FFFFFF" stroke="var(--gray)" stroke-width="4"/>
    <circle cx="380" cy="630" r="9" fill="#FFFFFF" stroke="var(--gray)" stroke-width="4"/>

    <!-- 라벨: 실행선 (위) -->
    <text class="nm" x="160" y="148" text-anchor="middle">1 초안 입력</text>
    <text class="ds" x="160" y="168" text-anchor="middle">직원이 보고서 초안을 넣는다</text>
    <text class="nm" x="380" y="148" text-anchor="middle">2 자가 평가</text>
    <text class="ds" x="380" y="168" text-anchor="middle">기준에 비춰 점검한다</text>
    <text class="nm" x="600" y="148" text-anchor="middle">3 1장 리포트</text>
    <text class="ds" x="600" y="168" text-anchor="middle">판정과 수정할 것 3건</text>
    <text class="nm" x="840" y="148" text-anchor="middle">4 1차 보고</text>
    <text class="ds" x="840" y="168" text-anchor="middle">고쳐서 보고한다</text>

    <!-- 라벨: 학습선 -->
    <text class="nm" x="1020" y="335" text-anchor="end">5 실측 기록</text>
    <text class="ds" x="1020" y="355" text-anchor="end">실제 피드백과 사전 평가를 대조한다</text>
    <text class="nm" x="900" y="528" text-anchor="middle">6 패턴 축적</text>
    <text class="ds" x="900" y="548" text-anchor="middle">반복되는 차이를 모은다</text>
    <text class="nm" x="720" y="444" text-anchor="middle">7 기준 제안</text>
    <text class="ds" x="720" y="464" text-anchor="middle">근거를 붙여 변경안을 올린다</text>
    <text class="nm-o" x="540" y="528" text-anchor="middle">8 최종 승인</text>
    <text class="ds" x="540" y="548" text-anchor="middle">주 1회, 승인한 것만 기준이 된다</text>

    <!-- 라벨: 세컨드브레인 (좌) + 기준 누적 -->
    <text class="tg" x="352" y="456" text-anchor="end">기준</text>
    <text class="nm" x="352" y="482" text-anchor="end">세컨드브레인</text>
    <text class="ds" x="352" y="504" text-anchor="end">평가기준 · 내부기준</text>
    <text class="vx" x="294" y="530" text-anchor="middle">v1</text>
    <text class="vx" x="318" y="530" text-anchor="middle">v2</text>
    <text class="vx-o" x="342" y="530" text-anchor="middle">v3</text>
    <line x1="286" y1="538" x2="302" y2="538" stroke="var(--line-1)" stroke-width="2"/>
    <line x1="310" y1="538" x2="326" y2="538" stroke="var(--gray-2)" stroke-width="2"/>
    <line x1="334" y1="538" x2="350" y2="538" stroke="var(--orange)" stroke-width="2"/>

    <!-- 라벨: 수집 (위) -->
    <text class="tg" x="98" y="568">원천</text>
    <text class="nm" x="98" y="590">수집</text>
    <text class="ds" x="98" y="610">인터뷰 · 기존 문서 · 과거 피드백</text>

    <!-- 라벨: 경량 온톨로지 (우) -->
    <text class="tg" x="402" y="610">전역규칙</text>
    <text class="nm" x="402" y="632">경량 온톨로지</text>
    <text class="ds" x="402" y="652">용어 · 타입 · 표기를 하나로 (비즈니스 인텔리전스 × 브랜드 아이덴티티)</text>

    <!-- 하단 지표 -->
    <line x1="40" y1="696" x2="1160" y2="696" stroke="var(--line-1)" stroke-width="1"/>
    <text x="40" y="724"><tspan class="ft">돌릴수록 좋아지는지 보는 지표</tspan><tspan class="fm" dx="24">판정 일치율</tspan><tspan class="fm" fill="#A3A3A3" dx="10">·</tspan><tspan class="fm" dx="10">사전 포착률</tspan><tspan class="fm" fill="#A3A3A3" dx="10">·</tspan><tspan class="fm" dx="10">1차 보고 통과율</tspan><tspan class="fm" fill="#A3A3A3" dx="10">·</tspan><tspan class="fm" dx="10">제안 채택률</tspan></text>
  </svg>
</div>
</body>
</html>
